<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Prompt Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrapper">
    <div class="box">
      <h1 class="title">AI Prompt Generator</h1>
      <p class="subtitle">Ask for a quote or a short story.</p>

      <form>
        <input type="text" id="prompt" placeholder="Enter your prompt..." required />
        <button type="submit">Generate</button>
      </form>
      
      <div id="output"></div>
<button id="continueBtn" class="hidden">Continue the story</button>

      

      <div id="loading" class="hidden">Thinking...</div>

      <div id="resultBox" class="hidden">
        <h3>AI's Response:</h3>
        <p id="responseText"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
